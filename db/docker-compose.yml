version: "3"

services:
  postgres:
    image: "postgres:14.0"
    ports:
      - "5439:5432"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      POSTGRES_USER: cataloge_db
      POSTGRES_PASSWORD: cataloge_db_password
      POSTGRES_DB: cataloge_services
    volumes:
      - ./db-data/postgres/:/var/lib/postgresql/data
